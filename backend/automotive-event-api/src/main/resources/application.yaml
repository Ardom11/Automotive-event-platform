spring:
  application:
    name: automotive-event-api
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
    consumer:
      group-id: automotive-notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}
  currency: eur
application:
  security:
    jwt:
      secret: ${SECRET_KEY}
      expiration: 3600000
    cookie:
      secure: true
  storage:
    max-file-size-bytes: 5242880
  base-url: ${APPLICATION_BASE_URL}
  expiration:
    unpaid-expiration-days-before-event: 7
  max-cars-per-application: 5
aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME}
    region: ${AWS_S3_REGION}
    presigned-url-expiration-minutes: 5
---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  kafka:
    bootstrap-servers: localhost:9092
application:
  swagger:
    enabled: true
  security:
    cookie:
      secure: false
---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
application:
  swagger:
    enabled: false
  security:
    cookie:
      secure: true